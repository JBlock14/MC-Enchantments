<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MC Enchantments</title>
    <script src="data.js"></script>
    <script>
      (function () {
        var file = themes.available[themes.default].file;
        try {
          var saved = localStorage.getItem("selectedTheme");
          if (saved && Object.hasOwn(themes.available, saved)) file = themes.available[saved].file;
        } catch (e) {}
        document.write('<link rel="stylesheet" href="' + file + '" id="themeStylesheet" />');
      })();
    </script>
    <link rel="icon" href="assets/favicon.ico" sizes="any" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#071427" />
    <meta name="description" content="Minecraft enchantment guide">
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="MC Enchantments" />
  </head>
  <body>
    <div class="bar">
      <div class="search-wrapper">
        <img src="assets/search.png" alt="search" class="search-icon" />
        <input placeholder="" class="search" id="search" aria-label="Search" />
      </div>
      <div class="filter-wrapper" data-name="">
        <div id="filterBtn" class="filter-btn" role="button" tabindex="0" aria-label="Filters">
          <img src="assets/filter.png" class="filter-normal" alt="Filter" />
          <img src="assets/filter_action.png" class="filter-hover" alt="Active filter" />
        </div>
        <div class="filter-popup" id="filterPopup"></div>
      </div>
    </div>
    <div class="language-wrapper">
      <button id="languageButton">
        <span id="currentLanguage"></span>
      </button>
      <div id="languagePopup">
        <input id="languageSearch" type="text" aria-label="Search language" />
        <div id="languageList"></div>
      </div>
    </div>
    <div id="helpOverlay" class="help-overlay">
      <div class="help-menu" role="dialog" aria-modal="true" aria-label="Help">
        <div class="help-header">
          <span>/help</span>
          <button class="close-btn" aria-label="Close">
            <img src="assets/close.png" class="close-normal" alt="Close" />
            <img src="assets/close_action.png" class="close-hover" alt="Close" />
          </button>
        </div>
        <div id="helpContent" class="help-content"></div>
      </div>
    </div>
    <div class="active-filters" id="activeFilters"></div>
    <p class="no-results" id="noResults" hidden></p>
    <div class="section-container" id="sectionContainer"></div>
    <footer id="footer">
      <div id="footerText"></div>
      <button id="supportButton"></button>
      <div id="legalText"></div>
    </footer>
    <script src="external_functions/marked.umd.js"></script>
    <script src="code.js"></script>
  </body>
</html>
